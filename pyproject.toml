[project]
name = "taller03"
version = "0.1.0"
description = "MCP telemetry server that emulates Kubernetes alerts"
readme = "README.md"
requires-python = ">=3.12, <=3.14.7"
dependencies = [
	"fastmcp>=2.12.0",
]

[project.scripts]
taller03 = "taller03:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
